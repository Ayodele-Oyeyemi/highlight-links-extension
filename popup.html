<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Highlight All Links</title>
  <style>
    body {
      width: 220px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      padding: 16px;
      margin: 0;
      background: #1e1e1e;
      color: #f0f0f0;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 12px 0;
      font-weight: 600;
    }
    button {
      width: 100%;
      padding: 10px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #ffd54f;
      color: #1e1e1e;
      transition: background 0.15s ease;
    }
    button:hover {
      background: #ffca28;
    }
    button.active {
      background: #4caf50;
      color: white;
    }
    #status {
      margin-top: 10px;
      font-size: 11px;
      color: #aaa;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>🔗 Highlight All Links</h1>
  <button id="toggleBtn">Highlight Links</button>
  <div id="status">Highlighting is off</div>

  <script src="popup.js"></script>
</body>
</html>
